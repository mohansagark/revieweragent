# Delete the source branch after a same-repo PR is merged.
# GitHub's "Automatically delete head branches" setting needs admin;
# this workflow is the equivalent for this repository.

name: delete-merged-branch

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete:
    if: |
      github.event.pull_request.merged &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged head branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$HEAD_REF" = "$DEFAULT_BRANCH" ]; then
            echo "refusing to delete default branch ${DEFAULT_BRANCH}"
            exit 0
          fi
          echo "Deleting refs/heads/${HEAD_REF}"
          set +e
          out="$(gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${HEAD_REF}" 2>&1)"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Deleted ${HEAD_REF}"
            exit 0
          fi
          if echo "$out" | grep -q '"status": "404"\|"status":"404"'; then
            echo "${HEAD_REF} already gone"
            exit 0
          fi
          echo "$out"
          exit "$status"
