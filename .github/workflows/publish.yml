name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build:cli
      # NPM_TOKEN if present; otherwise npm Trusted Publishing (OIDC).
      # setup-node's registry-url writes `_authToken=${NODE_AUTH_TOKEN}` even
      # when the secret is empty; npm then skips OIDC and PUTs with blank
      # credentials, which the registry reports as E404.
      - name: Publish to npm
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "Publishing with NPM_TOKEN"
          else
            echo "Publishing with OIDC trusted publisher"
            unset NODE_AUTH_TOKEN
            npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
            if [ -f "$npmrc" ]; then
              sed -i '/_authToken/d' "$npmrc"
            fi
          fi
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
